<title>富迪斯 產業新聞庫</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F5F9F8; --surface:#FFFFFF; --tint:#EAF7F4; --border:#DFEBE8; --border2:#CFE4DF;
  --text:#0E201D; --body:#33443F; --muted:#5A6B67;
  --brand:#009D88; --header:#00846F; --onHeader:#FFFFFF; --headerDim:#DCF0EB;
  --warnBg:#FDF6E7; --warnBd:#E8D5A6; --warnTx:#6B4700;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E201D; --surface:#16302B; --tint:#17332E; --border:#24443D; --border2:#2C514A;
    --text:#E8F5F1; --body:#C6DCD6; --muted:#93ADA7;
    --brand:#1FBFA3; --header:#16302B; --onHeader:#1FBFA3; --headerDim:#9DB5AF;
    --warnBg:#2B2618; --warnBd:#54492A; --warnTx:#E2CE9A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E201D; --surface:#16302B; --tint:#17332E; --border:#24443D; --border2:#2C514A;
  --text:#E8F5F1; --body:#C6DCD6; --muted:#93ADA7;
  --brand:#1FBFA3; --header:#16302B; --onHeader:#1FBFA3; --headerDim:#9DB5AF;
  --warnBg:#2B2618; --warnBd:#54492A; --warnTx:#E2CE9A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Microsoft JhengHei','微軟正黑體','PingFang TC','Heiti TC',sans-serif;
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
}
button,input,select{font-family:inherit;font-size:inherit}
a{color:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--header); border-bottom:1px solid var(--border);
}
.topin{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-size:17px;font-weight:700;color:var(--onHeader);text-decoration:none;white-space:nowrap;letter-spacing:1px}
.topsearch{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border2);border-radius:9px;padding:0 6px 0 12px;height:40px;max-width:620px}
.topsearch input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:15px;min-width:0}
.btn{border:0;border-radius:7px;background:var(--brand);color:#04231F;font-weight:700;cursor:pointer;padding:0 16px;height:30px;font-size:14px}
.ghost{background:var(--surface);color:var(--body);border:1px solid var(--border2);height:44px;border-radius:9px;padding:0 16px;font-weight:400;cursor:pointer;font-size:15px}
.ghost[aria-pressed="true"]{background:var(--tint);border-color:var(--brand);color:var(--brand);font-weight:700}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;cursor:pointer;color:var(--headerDim)}

.hero{background:var(--tint);border-bottom:1px solid var(--border);padding:44px 0 38px}
.hero h1{margin:0 0 10px;font-size:34px;font-weight:700;letter-spacing:2px;text-align:center}
.hero .meta{margin:0 0 20px;text-align:center;color:var(--body);font-size:15px}
.bigsearch{display:flex;align-items:center;gap:10px;max-width:680px;margin:0 auto;background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:0 8px 0 16px;height:56px}
.bigsearch input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;min-width:0}
.bigsearch .btn{height:42px;padding:0 24px;font-size:15px}
.hint{margin:12px 0 0;text-align:center;color:var(--muted);font-size:13px}

section.grp{padding:26px 0 0}
h2.lbl{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:2px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--border2);border-radius:999px;background:var(--surface);color:var(--text);text-decoration:none;font-size:15px;cursor:pointer}
.chip .n{font-size:13px;font-weight:700;color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#04231F;font-weight:700}
.chip[aria-pressed="true"] .n{color:#04231F}

.bar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:15}
.barin{display:flex;flex-direction:column;gap:12px;padding:14px 0}
.barrow{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 13px;border-radius:999px;background:var(--tint);border:1px solid var(--brand);color:var(--brand);font-size:14px}
.pill button{border:0;background:transparent;cursor:pointer;color:var(--brand);display:inline-flex;align-items:center;padding:4px}
.linkbtn{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin:16px 0;display:none}
.panel.open{display:block}
.panelgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.fgroup h3{margin:0 0 9px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:1.5px}
.opts{display:flex;flex-direction:column;gap:2px;max-height:210px;overflow:auto}
.opt{display:flex;align-items:center;gap:9px;padding:7px 4px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--body)}
.opt:hover{background:var(--tint)}
.opt input{width:17px;height:17px;accent-color:var(--brand);flex-shrink:0}
.opt .n{margin-left:auto;font-size:12px;color:var(--muted)}
.dates{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dates input{height:40px;border:1px solid var(--border2);border-radius:8px;background:var(--bg);color:var(--text);padding:0 10px}

.count{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0 10px;flex-wrap:wrap}
.count p{margin:0;color:var(--body);font-size:15px}
.count strong{font-size:20px;color:var(--text)}
.count .sort{color:var(--muted);font-size:13px}

.list{display:flex;flex-direction:column;gap:12px;padding-bottom:28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.card .t{font-size:18px;font-weight:700;line-height:1.5;color:var(--text);text-decoration:none}
.card .t:hover{color:var(--brand)}
.card .en{margin:0;font-size:13px;color:var(--muted)}
.card .m{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:6px;background:var(--tint);color:var(--brand);font-size:13px;border:0;cursor:pointer}
.snip{margin:2px 0 0;font-size:14px;line-height:1.8;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stat{font-size:12px;padding:2px 8px;border-radius:5px;border:1px solid var(--border2);color:var(--muted)}

.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:8px 0 40px;flex-wrap:wrap}
.pager button{min-width:44px;height:44px;padding:0 14px;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--body);cursor:pointer}
.pager button[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:#04231F;font-weight:700}
.pager button:disabled{opacity:.4;cursor:default}

.detail{padding:24px 0 60px;max-width:840px}
.back{display:inline-flex;align-items:center;gap:7px;font-size:14px;text-decoration:none;margin-bottom:18px}
.detail h1{margin:12px 0 12px;font-size:30px;font-weight:700;line-height:1.45}
.detail .en{margin:0 0 12px;color:var(--muted);font-size:15px}
.warn{display:flex;gap:11px;align-items:flex-start;background:var(--warnBg);border:1px solid var(--warnBd);color:var(--warnTx);border-radius:10px;padding:13px 16px;margin:18px 0;font-size:14px;line-height:1.7}
.box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px 26px;margin:18px 0}
.box.tinted{background:var(--tint);border-color:var(--border2)}
.box h2{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:2px}
.box.tinted h2{color:var(--brand)}
.box ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:11px}
.box li{line-height:1.9}
.box p{margin:0;line-height:1.9}
.kvs{display:flex;gap:40px;flex-wrap:wrap;margin:18px 0}
.kv h2{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:2px}
.kv p{margin:0;font-size:15px}
.cta{display:inline-flex;align-items:center;gap:9px;height:50px;padding:0 24px;border-radius:10px;background:var(--brand);color:#04231F;text-decoration:none;font-weight:700}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.hidden{display:none}
@media (max-width:640px){
  .hero{padding:30px 0 26px}
  .hero h1{font-size:26px}
  .topsearch{display:none}
  .detail h1{font-size:23px}
  .barin{padding:10px 0}
  .opts{max-height:170px}
}
</style>

d","co":["台積電"],"ind":["半導體／電子","閥門／流體控制設備"],"ev":["市場趨勢分析"],"cat":["產業關鍵字"],"kw":["AI"],"sum":["單通道傳輸速率升至 200G 以上時，電訊號在銅線中的能量衰減逾 90%，推動產業由可插拔光模組走向 CPO，終極目標為近乎零銅線的 3D COUPE 全光學介面。","台積電三層架構涵蓋運算層、異質整合層（CoWoS 與 SoIC-X 混合鍵合）及光子層；COUPE 以 3D SoIC 技術將 6nm 電晶片與 65nm 光晶片面對面堆疊，台積電為目前唯一具成熟光子設計套件（PDK）的業者。","量產時程：COUPE on Substrate 已小量量產（對應 SoIC 月產能約 4,000 至 5,000 片），大規模放量需待 2 年後；COUPE on Interposer 預計 2026 年試產、2030 年後放量；3D COUPE on ASIC 預估 2033 至 2035 年落地。","單顆光引擎成本約 100 美元、平均售價約 450 美元，推估毛利率約 78%；主要產能瓶頸在模組層級的光纖對準耗時。"],"rel":"文章聚焦矽光子技術藍圖，本身與流體控制無直接關聯；惟台積電 SoIC、CoWoS 等先進封裝產能後續擴充，將帶動廠務端製程氣體、化學品與超純水系統的閥件與儀器儀表需求，可列為中長期市場觀察。","warn":""},{"id":"20260910-05","zh":"AI 引爆資料複利效應，儲存架構躍居企業 AI 轉型新基石","en":"AI 引爆資料複利效應，儲存架構躍居企業 AI 轉型新基石","date":"2026/09/10","site":"TechNews 科技新報","url":"https://finance.technews.tw/2026/09/10/ai-unleashes-the-compounding-effect-of-data/","st":"Rejected","co":["IDC","WD"],"ind":["閥門／流體控制設備"],"ev":["市場趨勢分析"],"cat":["產業關鍵字"],"kw":["AI"],"sum":["此研究為 WD 贊助之 IDC 白皮書，94.7% 受訪企業過去 12 個月因導入 AI 與生成式 AI 而儲存更多資料，61% 企業資料量年增逾 25%，74% 預期未來三年維持此成長率。","59.4% 企業指出，合成資料、推論輸出與模型記錄等 AI 產生的數據是資料湖成長主因。","近 95% 企業認同 AI 提升了資料價值，74.3% 因此延長資料保存期間；75.9% 企業正重新調用冷儲存資料支援 AI，96% 預期未來需更快速檢索封存數據。","74.6% 企業採溫、涼、冷分層儲存，逾 60% 為冷資料或低頻存取資料；98.2% 企業視每 TB 總擁有成本（TCO）為儲存決策的重要考量。"],"rel":"屬資料儲存市場研究，與本公司流體控制業務無直接關聯。","warn":""},{"id":"20260910-04","zh":"微軟攜手全美教師公會制定校園 AI 新規，承諾禁用學生資料訓練模型","en":"微軟攜手全美教師公會制定校園 AI 新規，承諾禁用學生資料訓練模型","date":"2026/09/10","site":"TechNews 科技新報","url":"https://infosecu.technews.tw/2026/09/10/microsoft-american-federation-teachers-new-ai-rules-schools/","st":"Rejected","co":["微軟"],"ind":[],"ev":["法規政策"],"cat":["產業關鍵字"],"kw":["AI"],"sum":["在聯邦與州層級缺乏明確規範下，微軟與 AFT、UFT 歷經數月協商，於 9 日共同宣布此標準。","標準自 11 月 1 日起開放全美學區採用，可直接寫入現有或新簽訂的微軟合約，具法律效力且無須重新談判。","核心規範包括：除極少數安全與資安需求外，不得以師生資料訓練或改良 AI 模型，亦不得出售或挪作廣告；禁止追蹤學生、建立長期檔案、使用生物辨識資料及提供「AI 伴侶」產品。","AI 系統不得在缺乏人工監督下對學生做出決策；業者須以淺白語言說明工具運作與資料蒐集方式，違約時學區可終止合作並求償。"],"rel":"屬教育領域 AI 隱私規範，與本公司業務無關聯。","warn":""},{"id":"20260910-03","zh":"OpenAI 前員工新創 Besxar 乏獨立的商業社群，AI、半導體與生物科技領域的中國企業可視為正當的情報蒐集目標。","紐約時報指出，此言論顯示美方正模糊過去國安情報與經濟間諜之間的明確界線；時值川普預計本月與習近平舉行峰會，AI 與貿易為討論重點。","同日，美國 NSA、FBI 與 CISA 聯合發布警訊，指控多家中國 AI 企業自 2024 年起以「工業級規模」透過「蒸餾」手法竊取美國業者商業機密。","艾里斯另指出，「鹽颱風」電信入侵事件仍是嚴峻威脅，近期美國地方供水系統遭攻擊則疑與伊朗有關，凸顯關鍵基礎設施防護的迫切性。"],"rel":"屬美中科技競爭與情報議題，與本公司業務無直接關聯。文中提及美國地方供水系統遭網攻，反映水務等關鍵基礎設施控制系統的資安風險升高，僅可作為工控市場的背景參考。","warn":""},{"id":"20260909-12","zh":"OMV Petrom 完成 Petrobrazi 煉油廠電解槽模組全數交付","en":"OMV Petrom receives all electrolyser modules for Petrobrazi refinery","date":"2026/09/02","site":"Hydrocarbon Engineering","url":"https://www.hydrocarbonengineering.com/refining/02092026/omv-petrom-receives-all-electrolyser-modules-for-petrobrazi-refinery/","st":"Rejected","co":["OMV Petrom","Neuman & Esser","Kraftanlagen Romania"],"ind":["石油／原油","閥門／流體控制設備","再生能源"],"ev":["擴產"],"cat":["產業關鍵字","能源情境"],"kw":["Hydrogen","Refinery","氫能"],"sum":["第二座綠氫專案由七個 5 MW 電解模組組成，由德國 Neuman & Esser 供應，模組已於過去兩個月陸續運抵並整合至煉油廠設施，施工與組裝由 Kraftanlagen Romania 負責。","35 MW 專案獲羅馬尼亞國家復甦與韌性計畫（PNRR）約 2,900 萬歐元無償補助，營運後預估每年生產約 4,700 噸綠氫。","兩座綠氫專案合計年產約 8,000 噸，將用於煉油製程，包括生產永續航空燃油（SAF）與加氫處理植物油（HVO）。","OMV Petrom 同步興建年產 25 萬噸的 SAF/HVO 設施，目標成為東南歐首家主要永續燃料生產商。"],"rel":"煉油廠導入綠氫電解與 SAF/HVO 產線，涉及氫氣管線用閥件、高壓調壓閥與相關儀器儀表需求；國內中油與台塑集團亦在布局 SAF 與氫能，可作為國內業主減碳轉型設備需求的趨勢參考。","warn":""},{"id":"20260909-11","zh":"CITGO 投資 3.1 億美元強化 Lake Charles 煉油廠","en":"CITGO strengthens Lake Charles Refinery with US$310 million project","date":"2026/09/02","site":"Hydrocarbon Engineering","url":"https://www.hydrocarbonengineering.com/refining/02092026/citgo-strengthens-lake-charles-refinery-with-us310-million-project/","st":"Rejected","co":["CITGO Petroleum"],"ind":["石油／原油","石化／化工","閥門／流體控制設備","汽車／運輸物流"],"ev":["擴產"],"cat":["產業關鍵字"],"kw":["Refinery"],"sum":["專案將新增設施與設備，提升煉油廠的石腦油升級能力與操作彈性，以因應美國對運輸燃料的持續需求。","專案強化 Lake Charles 處理美國本土輕質原油並生產更多汽油組分的能力。","Lake Charles 煉油廠自 1944 年開始營運，為 CITGO 規模最大的煉油廠，產品涵蓋汽油、柴油、航空燃油與石化產品。","專案預計於 2029 年投入營運，施工期間將為當地帶來額外承包工作與供應商機會。"],"rel":"煉油廠新增脫戊烷塔等製程單元，將帶動蒸餾塔周邊控制閥、安全閥與儀器儀表需求；本案位於美國，對本公司直接商機有限，可作為煉油廠製程升級投資的趨勢參考。","warn":""},{"id":"20260909-10","zh":"CCS 基礎設施：保溫材料的關鍵角色","en":"CCS infrastructure: the critical role of insulation","date":"2026/09/03","site":"Hydrocarbon Engineering","url":"https://www.hydrocarbonengineering.com/special-reports/03092026/ccs-infrastructure-the-critical-role-of-insulation/","st":"Rejected","co":["PAROC","FOAMGLAS"],"ind":["閥門／流體控制設備"],"ev":["市場趨勢分析"],"cat":["產業關鍵字"],"kw":["Carbon Capture"],"sum":["全球 CCS 投資持續升溫：歐盟目標 2030 年前每年提供 5,000 萬噸 CO₂ 封存容量；GCCSI 統計全球有 77 座 CCUS 設施營運中、47 座興建中、逾 700 座規劃中，IEA 估計 2030 年專用封存容量可達每年 6.2 億噸。","CCS 製程橫跨多種溫度區間，文章建議在前端工程設計（FEED）階段即確立保溫規格，避免後期重工。","PAROC 岩棉保溫可耐溫至 700°C，適用儲槽與管線；FOAMGLAS 泡沫玻璃適用 -265°C 至 430°C，閉孔結構不吸水。","文章強調保溫下腐蝕（CUI）為成本最高卻最可預防的風險之一，並引述 ExxonMobil 數據指出 CUI 占其管線維修成本的 40% 至 60%。"],"rel":"本文屬保溫材料廠商的產品推廣文章，而非新聞事件，與本公司業務無直接關聯；文中 CCS 設施數量與成長數據，可作為碳捕捉相關閥件與儀表需求的市場背景參考。","warn":""},{"id":"20260909-09","zh":"GlobalData：非洲將帶動 2030 年前全球新增傳統煉油產能","en":"GlobalData: Africa to drive global upcoming conventional refineries capacity additions by 2030","date":"2026/09/03","site":"Hydrocarbon Engineering","url":"https://www.hydrocarbonengineering.com/refining/03092026/globaldata-africa-to-drive-global-upcoming-conventional-refineries-capacity-additions-by-2030/","st":"Rejected","co":["GlobalData"],"ind":["石油／原油","閥門／流體控制設備"],"ev":["市場趨勢分析"],"cat":["產業關鍵字","能源情境"],"kw":["Refinery","興建"],"sum":["非洲擁有大量新建與擴建煉油專案，預計占全球即將新增煉油產能的顯著比重，反映區域持續投資煉油基礎設施。","奈及利亞為非洲煉油開發的主要貢獻國，其 Lagos I CDU Expansion I 為非洲規模最大的煉油擴建專案之一。","阿爾及利亞與奈及利亞的擴建專案數量居非洲之首，將以既有設施擴建搭配新建煉油廠提升產能；埃及等國亦有專案推進。","非洲多數專案已進入興建階段，其餘多處於可行性研究與審批階段，顯示產能新增較可能在 2030 年前落實。"],"rel":"屬全球煉油產能趨勢分析；非洲煉油新建與擴建潮帶動製程閥件與儀器儀表需求，但與本公司以台灣為主的市場距離較遠，可作為全球煉油設備需求的背景參考。","warn":""},{"id":"20260909-08","zh":"Black & Veatch 推出 AI 基礎設施智慧平台 BVInfraIQ","en":"Black & Veatch launches BVInfraIQ","date":"2026/09/04","site":"Hydrocarbon Engineering","url":"https://www.hydrocarbonengineering.com/refining/04092026/black-veatch-launches-bvinfraiq/","st":"Rejected","co":["Black & Veatch"],"ind":["液化天然氣(LNG)","閥門／流體控制設備","資料中心／AI"],"ev":["新產品"],"cat":["產業關鍵字"],"kw":["AI"],"sum":["BVInfraIQ 結合 Black & Veatch 百年工程與顧問經驗及先進 AI 能力，協助基礎設施業主與營運者提升資產績效、強化韌性並加快決策。","平台不只著眼單一廠區的監控，而是分析整個系統的協同運作，提供以工程原理為基礎的優化建議，提升績效、可靠度、稼動率與成本效益。","核心功能包括：以第一原理工程與系統建模為基礎的建議、內建專有產業知識、依角色分級的即時營運儀表板，以及 AI 回饋迴路帶動的持續改善。","首波應用鎖定優化偏遠 LNG 資產，運用公司逾 60 年 LNG 技術經驗（其技術已用於全球半數以上營運中或興建中的浮式 LNG 設施），未來將擴及電力、資料中心與工業設施。"],"rel":"此類 AI 營運優化平台仰賴現場儀器儀表與控制閥提供的即時數據，顯示流體控制設備正與數位化監測、預測性維護深度整合；可作為本公司推廣智慧型閥件與儀表產品的市場趨勢參考。","warn":""},{"id":"20260909-07","zh":"孟加拉與伊斯蘭開發銀行簽署 10 億美元融資協議，擴建 Eastern Refinery","en":"Bangladesh and IsDB sign US$1 billion financing Agreement for Eastern Refinery expansion","date":"2026/09/04","site":"Hydrocarbon Engineering","url":"https://www.hydrocarbonengineering.com/refining/04092026/bangladesh-and-isdb-sign-us1-billion-financing-agreement-for-eastern-refinery-expansion/","st":"Rejected","co":["Islamic Development Bank","Eastern Refinery"],"ind":["石油／原油","閥門／流體控制設備","工程／EPC承包"],"ev":["擴產"],"cat":["產業關鍵字"],"kw":["Refinery"],"sum":["此計畫總投資 25 億美元，其中約 10 億美元由 IsDB 融資、約 15 億美元由孟加拉政府出資（含稅費），預計五年內完工。","擴建將新增每年 300 萬噸煉油產能，使總產能達每年 450 萬噸；在地煉製進口原油預估每年可節省約 3.94 億美元外匯。","升級後煉油廠可處理更多種類原油、生產 15 種油品，燃料標準由 Euro 2 提升至 Euro 5，並預期使主要油品成本降低 5%。","IsDB 董事會已於 2026 年 6 月 16 日在亞塞拜然巴庫舉行的年會期間核准此融資。"],"rel":"大型煉油廠擴建涉及大量製程閥件、控制閥與儀器儀表需求；本案已取得融資、即將進入執行階段，後續 EPC 發包與設備採購值得追蹤，但須視本公司代理品牌能否參與南亞地區專案而定。","warn":""},{"id":"20260909-06","zh":"EIA：煉油價差與原油價格走高，推升美國汽油零售價","en":"EIA: elevated crack spreads and crude oil prices contribute to higher prices at the pump","date":"2026/09/07","site":"Hydrocarbon Engineering","url":"https://www.hydrocarbonengineering.com/refining/07092026/eia-elevated-crack-spreads-and-crude-oil-prices-contribute-to-higher-prices-at-the-pump/","st":"Rejected","co":[],"ind":["石油／原油","閥門／流體控制設備"],"ev":["市場趨勢分析"],"cat":["產業關鍵字"],"kw":["Refinery"],"sum":["自 5 月以來，紐約港汽油煉油價差平均較 2025 年高出約每加侖 1 美元，主因是全球汽油供應吃緊。","自 3 月以來，美國汽油總進口量較 2021–2025 年五年平均低 32%；東西兩岸仰賴進口補充，部分缺口由墨西哥灣沿岸依《瓊斯法》豁免運送的船貨彌補。","餾分油與航空燃油的煉油價差更高，美國煉油業者因此調整產品結構以增產；截至 8 月 28 日當週，美國餾分油庫存低於五年平均 14%，汽油庫存低 6%。","勞動節前週一全美普通汽油零售均價為每加侖 4.07 美元，西岸最高達 5.21 美元，墨西哥灣沿岸最低為 3.62 美元。"],"rel":"屬煉油市場與油價分析，與本公司業務無直接關聯；高煉油價差有助提升煉油業者獲利及擴產、維修投資意願，可作為煉油產業景氣的背景參考。","warn":""},{"id":"20260909-05","zh":"Uniper 完成氫能進口接收站第一階段","en":"Uniper completes first phase of hydrogen terminal","date":"2026/09/07","site":"Hydrocarbon Engineering","url":"https://www.hydrocarbonengineering.com/tanks-terminals/07092026/uniper-has-completed-the-expression-of-interest-phase-for-its-hydrogen-import-terminal-in-wilhelmshaven-germany-receiving-sufficient-capacity-reservations-to-proceed-to-the-next-stage/","st":"Rejected","co":["Uniper"],"ind":["液化天然氣(LNG)","閥門／流體控制設備","再生能源"],"ev":["擴產"],"cat":["產業關鍵字"],"kw":["Hydrogen"],"sum":["Uniper 於 2026 年 5 月中旬啟動開放季，已與市場參與者簽署意向書（EoI），預訂容量足以支持接收站繼續開發。","意向書階段完成代表第一階段正式結束、第二階段展開，後續將發布主要條款（Heads of Terms）並制定接收站使用協議。","接收站採模組化設計，最大吞吐量可擴充至每年 260 萬噸氨（約相當於 35 萬噸氫）；若市場需要，Uniper 計畫再推出一次或多次開放季。"],"rel":"氨／氫進口接收站涉及低溫儲槽、卸收與輸送管線所需的低溫閥件與安全儀器，屬本公司流體控制設備的潛在應用領域；惟本案位於德國且仍在前期開發，對本公司直接商機有限，可作為氫能供應鏈建設的趨勢參考。","warn":""},{"id":"20260909-04","zh":"殼牌、施耐德電機與 Axens 啟動工業減碳合作計畫","en":"Shell, Schneider Electric, and Axens launch joint industrial decarbonisation project","date":"2026/09/08","site":"Hydrocarbon Engineering","url":"https://www.hydrocarbonengineering.com/refining/08092026/shell-schneider-electric-and-axens-launch-joint-industrial-decarbonisation-project/","st":"Approved","co":["Shell","Schneider Electric","Axens"],"ind":["石油／原油","石化／化工","閥門／流體控制設備","再生能源"],"ev":["合作"],"cat":["產業關鍵字","能源情境"],"kw":["Refinery","碳排"],"sum":["此電氣管式加熱爐為歐洲首座工業規模案例，設計上可達成零直接 CO₂ 與 NOx 排放，屬 Shell Rheinland 園區轉型與降低碳足跡計畫的一部分。","核心採用 Axens 旗下 Heurtey Petrochem Solutions 的電氣管式輻射加熱技術，作為傳統燃燒式加熱爐的低碳替代方案，並符合基礎油蒸餾製程的嚴格要求。","施耐德電機提供模組化預製電力方案，包括配電開關設備、變壓器及與 Axens 製程控制系統介接的電力控制系統，並與殼牌既有廠區設施整合。","「電力與製程整合」架構可實現快速精準的功率調節與細緻的加熱控制，展示製程技術、電氣工程與自動化結合推動電氣化加熱的可行性。"],"rel":"煉油製程由燃燒式加熱轉向電氣化加熱，將改變加熱爐周邊燃料氣管線、燃燒控制閥等設備需求，並提高製程控制與自動化整合的比重；可作為國內煉油與石化業主（如中油、台塑化）未來減碳改造方向的趨勢參考。","warn":""},{"id":"20260909-03","zh":"Rompetrol Rafinare 持續推動 Petromidia 煉油廠儲槽改造計畫","en":"Rompetrol Rafinare continues storage project at Petromidia refinery","date":"2026/09/08","site":"Hydrocarbon Engineering","url":"https://www.hydrocarbonengineering.com/refining/08092026/rompetrol-rafinare-continues-storage-project-at-petromidia-refinery/","st":"Rejected","co":["Rompetrol Rafinare","KMG International"],"ind":["石油／原油","閥門／流體控制設備"],"ev":["擴產"],"cat":["產業關鍵字"],"kw":["Refinery"],"sum":["計畫屬多年期投資的一環，旨在強化營運安全、改善作業流程，新儲槽及相關系統依最新工安與環保標準設計。","已完工的柴油餾分油儲槽由 5,000 立方米擴建至 6,000 立方米；汽油儲槽亦將擴至 6,000 立方米，另兩座柴油與調和組分儲槽由 10,000 立方米擴至 12,000 立方米，一座 57,000 立方米原油儲槽正在改造中。","施工採用液壓千斤頂由頂部與上層殼體向下建造，降低高空作業風險並加快工程進度；每項工程約需動員 100 名專業人員。","自 2007 年以來，公司旗下 Petromidia 與 Vega 兩座煉油廠已整修升級逾 60 座儲槽；Petromidia 於 2026 上半年處理原料近 260 萬噸。"],"rel":"煉油廠儲槽改建涉及進出料、排放與安全系統的閥件，以及液位、壓力等儀器儀表需求，屬本公司產品的典型應用場景；惟本案位於羅馬尼亞，對本公司直接商機有限，可作為煉油廠儲槽維修汰換需求的市場參考。","warn":""},{"id":"20260909-02","zh":"UniTorq 遭 NIBCO 收購","en":"UniTorq Acquired by NIBCO","date":"2026/09/04","site":"Valve Magazine","url":"https://valvemagazine.com/news/unitorq-acquired-by-nibco/","st":"Approved","co":["NIBCO","UniTorq"],"ind":["閥門／流體控制設備"],"ev":["收購"],"cat":["產業關鍵字"],"kw":["Valve","驅動器"],"sum":["⚠️ 疑似重複報導：可能與「NIBCO acquires UniTorq Actuators and Controls」講同一件事","NIBCO INC. 完成收購總部位於美國喬治亞州 Lawrenceville 的閥門驅動器製造商 UniTorq Actuators and Controls。","UniTorq 深耕商用與工業市場逾 25 年，為全球最大氣動驅動器品牌之一，產品線涵蓋氣動與電動驅動器、配件及控制器。","UniTorq 併入 NIBCO 後將保留原有人員、產品與品牌聲譽，NIBCO 並計劃投資升級其 IT 平台以支持營運與客戶服務品質。","NIBCO 總裁暨執行長 Ashley Martin 表示，此收購案有助加速公司策略目標並強化長期市場地位。"],"rel":"本文為閥門驅動器產業併購案，NIBCO 與 UniTorq 均為閥門及驅動器相關廠商，反映驅動器市場整合趨勢，命中本公司代理閥門與驅動器相關關鍵字；惟未見具名業主或本公司代理品牌直接涉入，關聯性中等。","warn":""},{"id":"20260909-01","zh":"VERSA 推出新款本質安全型電磁閥","en":"New Intrinsically Safe Solenoid from VERSA","date":"2026/09/04","site":"Valve Magazine","url":"https://valvemagazine.com/news/new-intrinsically-safe-solenoid-from-versa/","st":"Duplicate","co":["VERSA"],"ind":["液化天然氣(LNG)","石油／原油","石化／化工","閥門／流體控制設備"],"ev" 議設有固定排他期，各方可延長；目前尚未做出最終投資決策，也未取得建廠授權。","廠址規劃於瑞典 Nyköping 現有核能設施或 Valdemarsvik 的 Målma 場址二擇一，後者已於 2026 年 3 月依瑞典新法規提出申請；首部機組預計 2030 年代中期商轉。","權責劃分：Studsvik 主導許可申請、環評、場址權利與社區溝通；GVH 負責反應爐工程、執照支援與成本估算並擔任工程權責方；GVH 與 Samsung C&T 共同組成執行團隊，統籌建廠；DS Investment Partners 於排他期主導投資，GE Vernova 金融服務部門提供顧問與融資架構支援。"],"rel":"瑞典四部 BWRX-300 SMR 專案屬國際級核能新建案，涉及大量流體控制閥門與儀器儀表設備需求，可作為本公司觀察能源產業市場動向、評估潛在代理品牌商機的參考案例。","warn":""},{"id":"20260903-05","zh":"Greene Tweed 擴充低溫與超臨界二氧化碳測試能力","en":"Greene Tweed expands cryogenic and CO₂ testing capabilities","date":"2026/09/03","site":"Valve World","url":"https://valve-world.net/greene-tweed-expands-cryogenic-and-co%e2%82%82-testing-capabilities/","st":"Approved","co":["Greene Tweed"],"ind":["半導體／電子","閥門／流體控制設備","再生能源"],"ev":["擴產"],"cat":["產業關鍵字"],"kw":["Carbon Capture","Hydrogen"],"sum":["新的低溫洩漏測試系統可在低至 4K（−269°C／−452°F）、公差 +/−0.08K 的環境下評估密封性能，搭配高真空腔體、專用隔熱與氦氣洩漏偵測技術，偵測靈敏度達 5E-12 atm*cc/s。","測試範圍涵蓋半導體蝕刻製程、航太／太空系統及液態氫應用所需的低溫條件。","新增的超臨界二氧化碳快速洩壓（RGD）測試，依循 ISO 23936-2 等業界標準，可模擬最高 350°C、5,000 PSI 的客製化條件，鎖定碳捕集、利用與封存（CCUS）市場，協助閥門、管線、壓縮機、儲槽等 CCUS 基礎設施加速驗證流程。","Greene Tweed 執行長 Magen Buterbaugh 表示，此次投資強化公司因應客戶高風險、高難度挑戰的能力；產品工程與模擬資深經理 Cory Massey 則表示，此舉是為因應半導體、航太、氫能與 CCUS 領域對材料極限性能日益提高的需求。"],"rel":"本公司代理多項工業閥門與流體控制設備，服務對象涵蓋碳捕集（CCUS）與氫能相關產業。Greene Tweed 擴充的低溫與超臨界二氧化碳測試能力，直接對應這些領域對閥門、管線及密封元件在極端溫壓條件下可靠度驗證的需求，反映氫能與 CCUS 基礎設施市場對高規格零組件驗證能量持續成長，屬於本公司代理品項下游市場趨勢的參考指標。","warn":""},{"id":"20260903-04","zh":"Atomstroyexport 與 KNPP 簽署 Balkhash 核電廠 EPC 合約","en":"Atomstroyexport, KNPP sign Balkhash NPP EPC contract","date":"2026/09/03","site":"Valve World","url":"https://valve-world.net/atomstroyexport-knpp-sign-balkhash-npp-epc-contract/","st":"Rejected","co":["Atomstroyexport","Kazakhstan Nuclear Power Plants","Rosatom"],"ind":["電力／公用事業","閥門／流體控制設備","工程／EPC承包"],"ev":["專案得標"],"cat":["能源情境"],"kw":["核電","電廠"],"sum":["KNPP 與 Rosatom 子公司 Atomstroyexport 簽署 EPC 合約，共同推進 Balkhash 核電廠建設，廠址位於哈薩克阿拉木圖州占比爾區，靠近 Ulken。","電廠將裝設兩部 VVER-1200 三代加水冷式反應爐，單機電功率 1,200 MW，總裝置容量達 2,400 MW。","EPC 合約明訂 圖涵蓋全球 50 多個國家，主要服務領域包括氣體基礎設施、核能、數據中心、碳捕捉與封存及地熱等市場。","Baker Hughes 預計透過整合產品平台、工程與商業實踐，以及數位服務，在收購完成後的三年內達成 3.25 億美元的年化成本綜效。","原任 Baker Hughes 基礎設施與績效長 Jim Apostolides 將擔任該部門資深副總裁，負責主導整合業務。","本公司作為閥門、儀器儀表及流體控制設備的專業代理商，此項產業大型併購案有助於我司密切關注上游技術平台的整合趨勢，並評估未來產品供應鏈的變動與商機。"],"rel":"文章提及的 Baker Hughes 與 Chart Industries 皆為大型能源與流體控制設備製造商，其業務擴張後的產品線與整合可能影響我司代理產品在市場上的競爭態勢，且該收購案後的設備採購需求可能成為我司未來的潛在商機。","warn":""},{"id":"20260727-07","zh":"ABB 同意以 55 億美元現金收購 Rotork","en":"ABB agrees $5.5bn cash offer for Rotork","date":"2026/07/16","site":"Valve World","url":"https://valve-world.net/abb-agrees-5-5bn-cash-offer-for-rotork/","st":"Approved","co":["ABB","Rotork"],"ind":["閥門／流體控制設備"],"ev":["收購"],"cat":["競爭對手"],"kw":["ABB"],"sum":["ABB 以現金收購方式，以企業價值約 55 億美元收購專精於電動執行器與流體控制設備的製造商 Rotork。","Rotork 於 2025 年營收約 10 億美元，且調整後營業利潤率達 24.6%，預計併購後將使 ABB 自動化業務部門營收增加約 12%。","交易完成後，Rotork 將作為獨立部門納入 ABB 自動化業務領域，藉以強化 ABB 在現場裝置層（field-device layer）的自動化產品組合。","本交易預計於 2027 年上半年完成，並須通過股東及監管機構批准。","此併購案將對流體控制產業供應鏈產生重大結構性變動，我司應密切關注 Rotork 納入 ABB 體系後的通路整合與產品代理權變動情形。"],"rel":"Rotork 為全球知名閥門執行器大廠，是我司在流體控制領域的重要競品或潛在業務合作對象，此次收購將改變該品牌在自動化市場的市場定位與資源整合。","warn":""},{"id":"20260727-06","zh":"SLB OneSubsea 獲得兩份 Vår Energi 合約","en":"SLB OneSubsea secures two Vår Energi contracts","date":"2026/07/20","site":"Valve World","url":"https://valve-world.net/slb-onesubsea-secures-two-var-energi-contracts/","st":"Approved","co":["SLB OneSubsea","Vår Energi"],"ind":["液化天然氣(LNG)","閥門／流體控制設備","工程／EPC承包"],"ev":["專案得標"],"cat":["代理品牌"],"kw":["SLB"],"sum":["SLB OneSubsea 獲得 Vår Energi 兩項合約，將負責挪威大陸棚 Balder 及 Goliat 油田的水下生產基礎設施工程。","Goliat 專案範疇包含氣體出口系統的設計與交付，旨在連接 Goliat FPSO 至 Snøhvit 管線與 Melkøya 液化天然氣（LNG）設施。","Balder 專案將提供四套單罐衛星井口系統（Single-can satellite configurations）及相關臍帶纜系統（Umbilical systems）。","本次合作涵蓋水下生產、臍帶纜與電纜、加工系統業務，並包含多相流量計（Multiphase meters）的供應。","本公司可持續關注此類水下生產系統與多相流體計量設備的市場需求，為相關能源專案提供技術支援與設備方案。"],"rel":"Vår Energi 作為挪威重要油氣營運商，其開發的 Balder 與 Goliat 油田專案可能對水下閥門及流體控制設備有相關採購需求，為我司潛在的目標客戶或相關供應鏈合作對象。","warn":""},{"id":"20260727-05", PO POYAM VALVES wins Aramco cryogenic gate valve order","date":"2026/07/23","site":"Valve World","url":"https://valve-world.net/ampo-poyam-valves-wins-aramco-cryogenic-gate-valve-order/","st":"Approved","co":["AMPO POYAM VALVES","Aramco","Técnicas Reunidas"],"ind":["液化天然氣(LNG)","石油／原油","石化／化工","閥門／流體控制設備","工程／EPC承包"],"ev":["專案得標"],"cat":["競爭對手"],"kw":["AMPO"],"sum":["AMPO POYAM VALVES 獲選為沙烏地阿拉伯 Aramco 的 Riyas NGL 分餾工廠專案供應 180 台大型閘閥。","供應設備包含 148 台尺寸達 64 英吋、壓力等級 600 lbs 的低溫閘閥，以及尺寸達 68 英吋的通用型大型閘閥。","Riyas NGL 分餾廠隸屬於 Jafurah 非常規天然氣田開發計畫，設有兩條分餾線，每條日產能為 25.5 萬桶。","本次專案由工程總承包商 (EPC) Técnicas Reunidas 執行，因設備需同時滿足超大口徑與嚴苛低溫作業條件，故供應商的技術能力為關鍵評選標準。","此案例證明了極端氣候條件下對高品質大型流體控制設備的剛性需求，與我司代理之高性能工業閥門及儀器儀表產品定位一致，可作為我司開發能源產業客戶之技術實證參考。"],"rel":"該專案業主 Aramco 為我司潛在客戶，且此大型訂單顯示石化產業對於高品質閥門與低溫設備的需求趨勢，有助於我司掌握市場動向與業務開發機會。","warn":""}]</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('data').textContent);
var PAGE = 25;
var app = document.getElementById('app');

DATA.forEach(function(r){
  r.title = r.zh || r.en;
  r.alt = (r.zh && r.en && r.zh !== r.en) ? r.en : '';
  r.hay = ((r.zh||'') + ' ' + (r.en||'')).toLowerCase();
});
DATA.sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });

var BY = {};
DATA.forEach(function(r){ BY[r.id] = r; });

function counts(key){
  var m = Object.create(null);
  DATA.forEach(function(r){
    var vs = r[key];
    if(!vs || !vs.length){ m['未分類'] = (m['未分類']||0)+1; return; }
    vs.forEach(function(v){ m[v] = (m[v]||0)+1; });
  });
  return Object.keys(m).map(function(k){ return {label:k, n:m[k]}; })
    .sort(function(a,b){ return b.n - a.n; });
}
function countsOne(key){
  var m = Object.create(null);
  DATA.forEach(function(r){ var v = r[key] || '未分類'; m[v] = (m[v]||0)+1; });
  return Object.keys(m).map(function(k){ return {label:k, n:m[k]}; })
    .sort(function(a,b){ return b.n - a.n; });
}
var C = {
  ind: counts('ind'), ev: counts('ev'), co: counts('co'),
  site: countsOne('site'), st: countsOne('st')
};
var LATEST = DATA.reduce(function(a,r){ return r.date > a ? r.date : a; }, '');

var FIELDS = [
  {k:'ind',  label:'產業',     multi:true},
  {k:'ev',   label:'事件類型', multi:true},
  {k:'co',   label:'公司',     multi:true},
  {k:'site', label:'來源',     multi:false},
  {k:'st',   label:'審核狀態', multi:false}
];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); }

function readState(){
  var h = location.hash.slice(1) || '/';
  var qi = h.indexOf('?');
  var path = qi < 0 ? h : h.slice(0, qi);
  var sp = new URLSearchParams(qi < 0 ? '' : h.slice(qi+1));
  var st = {path:path, q:sp.get('q')||'', from:sp.get('from')||'', to:sp.get('to')||'', page:parseInt(sp.get('page')||'1',10)||1};
  FIELDS.forEach(function(f){
    var v = sp.get(f.k);
    st[f.k] = v ? v.split('|').filter(Boolean) : [];
  });
  return st;
}
function toHash(st){
  var sp = new URLSearchParams();
  if(st.q) sp.set('q', st.q);
  FIELDS.forEach(function(f){ if(st[f.k].length) sp.set(f.k, st[f.k].join('|')); });
  if(st.from) sp.set('from', st.from);
  if(st.to) sp.set('to', st.to);
  if(st.page > 1) sp.set('page', st.page);
  var s = sp.toString();
  return '#/search' + (s ? '?' + s : '');
}
function go(st){ location.hash = toHash(st); }
function hasFilters(st){
  return !!(st.q || st.from || st.to || FIELDS.some(function(f){ return st[f.k].length; }));
}

function match(r, st){
  if(st.q){
    var q = st.q.toLowerCase().trim();
    if(q && r.hay.indexOf(q) < 0) return false;
  }
  if(st.from && r.date < st.from) return false;
  if(st.to && r.date > st.to) return false;
  for(var i=0;i<FIELDS.length;i++){
    var f = FIELDS[i], sel = st[f.k];
    if(!sel.length) continue;
    var vals = f.multi ? (r[f.k].length ? r[f.k] : ['未分類']) : [r[f.k] || '未分類'];
    var ok = sel.some(function(s){ return vals.indexOf(s) >= 0; });
    if(!ok) return false;
  }
  return true;
}

function chipRow(field, items, st, limit){
  return items.slice(0, limit).map(function(it){
    var on = st[field].indexOf(it.label) >= 0;
    return '<button class="chip" type="button" data-f="'+field+'" data-v="'+esc(it.label)+'" aria-pressed="'+on+'">'
      + '<span>'+esc(it.label)+'</span><span class="n">'+it.n+'</span></button>';
  }).join('');
}

function viewLanding(st){
  return '<div class="hero"><div class="wrap">'
    + '<h1>產業新聞搜尋</h1>'
    + '<p class="meta">收錄 <strong style="color:var(--brand)">'+DATA.length+'</strong> 筆新聞　·　資料更新至 <strong style="color:var(--brand)">'+esc(LATEST)+'</strong>　·　'+C.site.length+' 個來源</p>'
    + '<div class="bigsearch">'
      + '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--muted)"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>'
      + '<label for="qbig" class="hidden">搜尋新聞</label>'
      + '<input id="qbig" type="search" placeholder="搜尋新聞標題、公司名稱…" value="'+esc(st.q)+'">'
      + '<button class="btn" id="gobig" type="button">搜尋</button>'
    + '</div>'
    + '<p class="hint">同時搜尋中文與英文標題　·　或直接點下方標籤開始</p>'
    + '</div></div>'
    + '<div class="wrap">'
    + '<section class="grp"><h2 class="lbl">依產業</h2><div class="chips">'+chipRow('ind', C.ind, st, 12)+'</div></section>'
    + '<section class="grp"><h2 class="lbl">依事件類型</h2><div class="chips">'+chipRow('ev', C.ev, st, 14)+'</div></section>'
    + '<section class="grp"><h2 class="lbl">依公司</h2><div class="chips">'+chipRow('co', C.co, st, 16)+'</div></section>'
    + '<section class="grp"><h2 class="lbl">依來源</h2><div class="chips">'+chipRow('site', C.site, st, 12)+'</div></section>'
    + '<section class="grp" style="padding-bottom:50px"><h2 class="lbl">依審核狀態</h2><div class="chips">'+chipRow('st', C.st, st, 8)+'</div></section>'
    + '</div>';
}

function filterPanel(st){
  var groups = FIELDS.map(function(f){
    var items = C[f.k];
    var opts = items.map(function(it){
      var on = st[f.k].indexOf(it.label) >= 0;
      return '<label class="opt"><input type="checkbox" data-f="'+f.k+'" data-v="'+esc(it.label)+'"'+(on?' checked':'')+'>'
        + '<span>'+esc(it.label)+'</span><span class="n">'+it.n+'</span></label>';
    }).join('');
    return '<div class="fgroup"><h3>'+esc(f.label)+'</h3><div class="opts">'+opts+'</div></div>';
  }).join('');
  var dates = '<div class="fgroup"><h3>發布日期</h3><div class="dates">'
    + '<label class="hidden" for="dfrom">起</label><input id="dfrom" type="date" value="'+esc(st.from)+'">'
    + '<span style="color:var(--muted)">至</span>'
    + '<label class="hidden" for="dto">迄</label><input id="dto" type="date" value="'+esc(st.to)+'">'
    + '</div></div>';
  return '<div class="panel" id="panel"><div class="panelgrid">'+groups+dates+'</div></div>';
}

function activePills(st){
  var out = [];
  FIELDS.forEach(function(f){
    st[f.k].forEach(function(v){
      out.push('<span class="pill"><span>'+esc(v)+'</span><button type="button" data-f="'+f.k+'" data-v="'+esc(v)+'" aria-label="移除 '+esc(v)+'">'
        + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>'
        + '</button></span>');
    });
  });
  if(st.q) out.push('<span class="pill"><span>「'+esc(st.q)+'」</span><button type="button" data-f="q" data-v="" aria-label="清除關鍵字"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button></span>');
  if(st.from || st.to) out.push('<span class="pill"><span>'+esc(st.from||'…')+' ～ '+esc(st.to||'…')+'</span><button type="button" data-f="date" data-v="" aria-label="清除日期"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button></span>');
  return out;
}

function card(r){
  var tags = []
    .concat(r.co.slice(0,2), r.ind.slice(0,2), r.ev.slice(0,2))
    .map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join('');
  return '<article class="card">'
    + '<a class="t" href="#/news/'+esc(r.id)+'">'+esc(r.title)+'</a>'
    + (r.alt ? '<p class="en">'+esc(r.alt)+'</p>' : '')
    + '<div class="m"><span>'+esc(r.date)+'</span><span>·</span><span>'+esc(r.site)+'</span><span class="stat">'+esc(r.st)+'</span></div>'
    + (tags ? '<div class="tags">'+tags+'</div>' : '')
    + (r.sum.length ? '<p class="snip">'+esc(r.sum.join('　'))+'</p>' : '')
    + '</article>';
}

function viewSearch(st){
  var hits = DATA.filter(function(r){ return match(r, st); });
  var pages = Math.max(1, Math.ceil(hits.length / PAGE));
  var page = Math.min(st.page, pages);
  var slice = hits.slice((page-1)*PAGE, page*PAGE);
  var pills = activePills(st);

  var pager = '';
  if(pages > 1){
    var btns = '<button type="button" data-p="'+(page-1)+'"'+(page<=1?' disabled':'')+'>上一頁</button>';
    var start = Math.max(1, page-2), end = Math.min(pages, start+4);
    start = Math.max(1, end-4);
    for(var i=start;i<=end;i++){
      btns += '<button type="button" data-p="'+i+'" aria-current="'+(i===page)+'">'+i+'</button>';
    }
    btns += '<button type="button" data-p="'+(page+1)+'"'+(page>=pages?' disabled':'')+'>下一頁</button>';
    pager = '<div class="pager">'+btns+'</div>';
  }

  return '<div class="bar"><div class="wrap barin">'
      + '<div class="barrow">'
        + '<button class="ghost" id="togglePanel" type="button" aria-pressed="false">篩選條件</button>'
        + FIELDS.map(function(f){
            var n = st[f.k].length;
            return '<button class="ghost" type="button" data-jump="'+f.k+'" aria-pressed="'+(n>0)+'">'+esc(f.label)+(n?' ('+n+')':'')+'</button>';
          }).join('')
      + '</div>'
      + (pills.length ? '<div class="barrow"><span style="font-size:13px;color:var(--muted)">已套用</span>'+pills.join('')+'<button class="linkbtn" id="clearAll" type="button">清除全部</button></div>' : '')
    + '</div></div>'
    + '<div class="wrap">'
    + filterPanel(st)
    + '<div class="count"><p>共 <strong>'+hits.length+'</strong> 筆</p><span class="sort">依發布日期排序（新到舊）</span></div>'
    + (slice.length
        ? '<div class="list">'+slice.map(card).join('')+'</div>'+pager
        : '<div class="empty">找不到符合條件的新聞，試著放寬篩選或換個關鍵字。</div>')
    + '</div>';
}

function viewDetail(id){
  var r = BY[id];
  if(!r) return '<div class="wrap"><div class="empty">找不到這筆新聞。<br><a href="#/search">回到搜尋</a></div></div>';
  var tags = [].concat(r.co, r.ind, r.ev).map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join('');
  return '<div class="wrap detail">'
    + '<a class="back" href="#/search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"></polyline></svg><span>返回搜尋結果</span></a>'
    + (tags ? '<div class="tags">'+tags+'</div>' : '')
    + '<h1>'+esc(r.title)+'</h1>'
    + (r.alt ? '<p class="en">'+esc(r.alt)+'</p>' : '')
    + '<div class="m" style="display:flex;gap:10px;color:var(--muted);font-size:14px;flex-wrap:wrap"><span>'+esc(r.date)+'</span><span>·</span><span>'+esc(r.site)+'</span><span>·</span><span>'+esc(r.id)+'</span><span class="stat">'+esc(r.st)+'</span></div>'
    + (r.warn ? '<div class="warn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-top:3px"><path d="M12 3 L22 20 L2 20 Z"></path><line x1="12" y1="9" x2="12" y2="14"></line><line x1="12" y1="17" x2="12" y2="17"></line></svg><p style="margin:0">'+esc(r.warn)+'</p></div>' : '')
    + (r.sum.length ? '<section class="box"><h2>重點摘要</h2><ul>'+r.sum.map(function(b){ return '<li>'+esc(b)+'</li>'; }).join('')+'</ul></section>' : '')
    + (r.rel ? '<section class="box tinted"><h2>與本公司的關聯</h2><p>'+esc(r.rel)+'</p></section>' : '')
    + '<div class="kvs">'
      + (r.kw.length ? '<div class="kv"><h2>命中關鍵字</h2><p>'+esc(r.kw.join('、'))+'</p></div>' : '')
      + (r.cat.length ? '<div class="kv"><h2>命中分類</h2><p>'+esc(r.cat.join('、'))+'</p></div>' : '')
    + '</div>'
    + (r.url ? '<a class="cta" href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer"><span>閱讀原文</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4 H20 V10"></path><line x1="20" y1="4" x2="11" y2="13"></line><path d="M18 14 V19 A1 1 0 0 1 17 20 H5 A1 1 0 0 1 4 19 V7 A1 1 0 0 1 5 6 H10"></path></svg></a>' : '')
    + '</div>';
}

function toggleVal(st, f, v){
  var arr = st[f], i = arr.indexOf(v);
  if(i >= 0) arr.splice(i,1); else arr.push(v);
  st.page = 1;
}

function render(){
  var st = readState();
  var top = document.getElementById('qtop');
  if(top) top.value = st.q;

  if(st.path.indexOf('/news/') === 0){
    app.innerHTML = viewDetail(decodeURIComponent(st.path.slice(6)));
    window.scrollTo(0,0);
    return;
  }
  if(st.path === '/search' && hasFilters(st)){
    app.innerHTML = viewSearch(st);
    wireSearch(st);
    return;
  }
  app.innerHTML = viewLanding(st);
  wireLanding(st);
}

function wireLanding(st){
  var big = document.getElementById('qbig');
  function submit(){ st.q = big.value.trim(); st.page = 1; go(st); }
  document.getElementById('gobig').addEventListener('click', submit);
  big.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
  app.querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click', function(){
      toggleVal(st, b.dataset.f, b.dataset.v);
      go(st);
    });
  });
}

function wireSearch(st){
  var panel = document.getElementById('panel');
  var toggle = document.getElementById('togglePanel');
  toggle.addEventListener('click', function(){
    var open = panel.classList.toggle('open');
    toggle.setAttribute('aria-pressed', String(open));
  });
  app.querySelectorAll('[data-jump]').forEach(function(b){
    b.addEventListener('click', function(){
      panel.classList.add('open');
      toggle.setAttribute('aria-pressed','true');
      panel.scrollIntoView({block:'nearest'});
    });
  });
  panel.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.addEventListener('change', function(){
      toggleVal(st, cb.dataset.f, cb.dataset.v);
      go(st);
    });
  });
  var df = document.getElementById('dfrom'), dt = document.getElementById('dto');
  function dates(){ st.from = df.value; st.to = dt.value; st.page = 1; go(st); }
  df.addEventListener('change', dates);
  dt.addEventListener('change', dates);

  app.querySelectorAll('.pill button').forEach(function(b){
    b.addEventListener('click', function(){
      var f = b.dataset.f;
      if(f === 'q') st.q = '';
      else if(f === 'date'){ st.from = ''; st.to = ''; }
      else toggleVal(st, f, b.dataset.v);
      st.page = 1;
      go(st);
    });
  });
  var clr = document.getElementById('clearAll');
  if(clr) clr.addEventListener('click', function(){ location.hash = '#/'; });

  app.querySelectorAll('.pager button').forEach(function(b){
    if(b.disabled) return;
    b.addEventListener('click', function(){ st.page = parseInt(b.dataset.p,10); go(st); window.scrollTo(0,0); });
  });
}

var topInput = document.getElementById('qtop');
function topSubmit(){
  var st = readState();
  st.q = topInput.value.trim();
  st.page = 1;
  go(st);
}
document.getElementById('gotop').addEventListener('click', topSubmit);
topInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') topSubmit(); });

var themeBtn = document.getElementById('theme');
try{
  var saved = localStorage.getItem('fcg-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
}catch(e){}
themeBtn.addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('fcg-theme', next); }catch(e){}
});

window.addEventListener('hashchange', render);
render();
})();
</script>
</body>
</html>
